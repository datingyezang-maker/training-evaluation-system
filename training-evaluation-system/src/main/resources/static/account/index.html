<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>培训平台 · 个人工作台</title><link rel="stylesheet" href="/assets/app.css"><link rel="stylesheet" href="/assets/public-ui.css?v=11"><script defer src="/assets/account.js"></script></head>
<body class="account-page"><header><div class="brand">评</div><span>培训评价 · 个人工作台</span><span id="portal-role" class="portal-role"></span></header><nav id="portal-nav" hidden aria-label="个人工作台导航"></nav>
<main><section id="auth" class="portal-auth"><div class="auth-story"><p class="portal-eyebrow">LEARN · TEACH · IMPROVE</p><h1>让每一次反馈，<br>成为下一次进步。</h1><p>学员完成课程评价，教师了解教学反馈。<br>同一个账号，连接你的培训与成长。</p><a href="/admin/">管理工作台 →</a></div><div class="panel auth-card"><div class="portal-tabs" aria-label="登录与注册"><button id="show-login" type="button" aria-pressed="true">账号登录</button><button id="show-register" type="button" aria-pressed="false">注册账号</button></div>
<section id="login-section"><h2>欢迎回来</h2><p>学员和教师使用手机号登录。</p><form id="login" novalidate><p id="account-login-error" class="form-error" role="alert" aria-live="assertive"></p><label>手机号<input name="username" type="tel" pattern="1[3-9][0-9]{9}" maxlength="11" autocomplete="username" placeholder="请输入手机号" required></label><label>密码<input name="password" type="password" autocomplete="current-password" placeholder="请输入登录密码" required></label><button>登录工作台</button></form></section>
<section id="registration" hidden><h2>创建个人账号</h2><p>教师注册后需管理员审核。手机号归属尚未通过短信验证。</p><form id="register"><label>姓名<input name="display_name" maxlength="80" required></label><label>手机号<input name="phone" type="tel" pattern="1[3-9][0-9]{9}" maxlength="11" required></label><label>身份<select name="role"><option value="STUDENT">学员</option><option value="TEACHER">教师（待审核）</option></select></label><label>密码（至少12位）<input name="password" type="password" minlength="12" maxlength="72" autocomplete="new-password" required></label><label>确认密码<input name="confirm_password" type="password" autocomplete="new-password" required></label><label>图形验证码<span class="captcha-line"><input name="captcha" maxlength="5" autocomplete="off" required><img id="captcha" alt="图形验证码，点击刷新" title="点击刷新"></span></label><button>提交注册</button></form></section></div></section>
<section id="profile" hidden><section class="portal-hero"><div><p class="portal-eyebrow" id="portal-kicker"></p><h1 id="name"></h1><p id="hint"></p></div><a id="management-entry" class="portal-management" href="/admin/" hidden>培训组织工作台 →</a></section><div id="portal-metrics" class="portal-metrics"></div><section id="course-panel" class="panel"><div class="section-heading"><div><h2 id="course-heading"></h2><p id="course-description"></p></div><input id="course-search" type="search" placeholder="搜索课程、班次或教师" aria-label="搜索我的课程"></div><div id="teaching-actions" class="teaching-actions" hidden><button id="teacher-create" type="button">＋ 新增授课</button><button id="teacher-publish" type="button">发布评价</button><p id="teaching-hint"></p></div><div id="courses" class="portal-course-grid"></div></section>
<section id="account-panel" class="panel" hidden><h2>账号与安全</h2><p id="account-summary"></p><form id="change"><label>原密码<input name="old_password" type="password" autocomplete="current-password" required></label><label>新密码（至少12位）<input name="new_password" type="password" minlength="12" maxlength="72" autocomplete="new-password" required></label><button>修改密码并重新登录</button></form><button id="exit" type="button" class="portal-exit">退出登录</button></section></section><p id="message" role="status" aria-live="polite"></p></main>
<dialog id="feedback-dialog" class="feedback-dialog"><button id="feedback-close" type="button" aria-label="关闭课程反馈">×</button><div id="feedback-content"></div></dialog><dialog id="teaching-dialog" class="feedback-dialog teaching-dialog"><button id="teaching-close" type="button" aria-label="关闭授课操作">×</button><div id="teaching-content"></div></dialog><footer class="portal-footer">培训评价 · 数据保存在单位内部</footer></body></html>
