<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>课程评价</title><link rel="stylesheet" href="/assets/app.css"><script defer src="/assets/h5.js"></script><link rel="stylesheet" href="/assets/public-ui.css?v=11"></head><body><header><div class="brand">评</div><span>课程评价</span></header><main class="mobile"><p><a id="h5-account-link" href="/account/">手机号登录 / 注册 · 我的课程</a></p><p class="eyebrow">COURSE FEEDBACK</p><h1>你的反馈，<br>让下一堂课更好。</h1><section id="course" class="panel">正在读取课程…</section><form id="evaluation" class="panel" hidden><label>个人评价码<input name="access_code" required maxlength="64" autocomplete="off" placeholder="请输入管理员单独发放的评价码"></label><p id="rating-progress" aria-live="polite"></p><div id="scores"></div><label>意见建议（选填）<textarea name="comment" maxlength="1000" rows="4"></textarea></label><p>各项1—5分，5分为最高。提交后不可修改。平台保留资格核验信息，并非完全匿名。</p><button id="submit" type="submit">提交评价</button></form><p id="message" role="status" aria-live="polite"></p></main></body></html>
