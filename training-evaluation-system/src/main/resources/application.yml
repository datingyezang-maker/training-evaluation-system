server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.springframework.jdbc: INFO
    org.springframework.security: INFO
spring:
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  application:
    name: training-evaluation
  profiles:
    default: dev
  jackson:
    time-zone: Asia/Shanghai
  flyway:
    enabled: true
app:
  # 正式部署时设置为手机可访问的 HTTPS 域名；本机扫码需使用局域网 IP。
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
  security:
    admin-password: ${APP_ADMIN_PASSWORD:}
